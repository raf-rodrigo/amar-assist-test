name: CI and automatic merge

on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel application
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit tests
        working-directory: backend
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  merge:
    name: Create pull request and enable auto-merge
    needs: test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'

    steps:
      - name: Create or find pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          PR_URL=$(gh pr list --base main --head "$HEAD_BRANCH" --state open --json url --jq '.[0].url')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "CI: merge $HEAD_BRANCH into main" \
              --body "This pull request was created automatically after the CI pipeline passed.")
          fi

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
